os: linux

dist: jammy

language: minimal

services:
  - docker

stages:
  - tools
  - test

jobs:
  include:
    - stage: tools
      name: Prepare shared CI tools image
      cache: false
      script: bash ci/tools-image.sh ensure
    - stage: test
      name: Public plugins
      env: PLUGINS_VISIBILITY=public
    - stage: test
      name: Private plugins
      env: PLUGINS_VISIBILITY=private

cache:
  timeout: 600
  directories:
    - $HOME/.cache/go-build
    - $HOME/gopath/pkg/mod
    - $HOME/gopath/pkg/sumdb

install: skip

script:
  - bash ci/run.sh
